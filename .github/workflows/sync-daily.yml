name: sync-daily

# KST 08:00 (= UTC 23:00 전날). 당월 일정 + 순위 + 등록/말소 보정 1회.
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: 당월 일정
        run: node scripts/extract-kbo-schedule.mjs
      - name: 어제 잔여 경기 백필
        # 자정 넘겨 종료된 미기록 경기를 아침에 보정 수집(멱등, 신규 없으면 즉시 no-op).
        run: node scripts/extract-kbo-review.mjs yesterday
      - name: 아침 예측 최신화
        # 백필로 갱신된 실제 선발을 반영해 오늘~D+3 예측 재생성(멱등이라 안전).
        run: node scripts/generate-starter-forecast.mjs
      - name: 순위 스냅샷
        run: node scripts/extract-kbo-standings.mjs
      - name: 등록/말소 보정
        run: node scripts/extract-kbo-availability.mjs
      - name: commit & push
        # 스크립트가 실패해도 그 전에 저장된 수집분은 커밋한다(md 쓰기는 멱등, 실패 알림은 잡 상태로 유지).
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || (git commit -m "data: sync-daily 일정/순위/등록말소 갱신" && git pull --rebase && git push)
