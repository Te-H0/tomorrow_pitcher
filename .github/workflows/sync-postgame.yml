name: sync-postgame

# 경기 종료 후 실제 선발/결과 + 순위 + 예측. KST 21:30~24:30 30분 간격.
on:
  schedule:
    - cron: "0,30 12-15 * * *" # UTC 12:00~15:30 = KST 21:30~24:30
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: 실제 선발 + 경기 결과 (오늘)
        id: review
        run: node scripts/extract-kbo-review.mjs
      - name: 순위 스냅샷
        if: steps.review.outputs.collected != '0'
        run: node scripts/extract-kbo-standings.mjs
      - name: 예상 선발 (오늘~D+3)
        if: steps.review.outputs.collected != '0'
        run: node scripts/generate-starter-forecast.mjs
      - name: commit & push
        # 스크립트가 실패해도 그 전에 저장된 수집분은 커밋한다(md 쓰기는 멱등, 실패 알림은 잡 상태로 유지).
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || (git commit -m "data: sync-postgame 실제 선발/결과/예측 갱신" && git pull --rebase && git push)
