name: sync-preview

# 공식 예고 선발 반복 수집. KST 09,12,15,18,21,23시.
# 등록/말소는 15시(UTC 06) 회차에 함께 수집하되, 경기 없는 월요일은 접수 마감이 16:30이라 18시(UTC 09) 회차로 미룬다.
on:
  schedule:
    - cron: "0 0,3,12,14 * * *" # KST 09,12,21,23 — preview만
    - cron: "0 6 * * *"         # KST 15 — preview + availability(월요일 제외)
    - cron: "0 9 * * *"         # KST 18 — preview + availability(월요일만)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # 기본 6시간 방치를 막는다. playwright 설치가 매달려 6시간 좀비 런이 되면
    # data-sync 동시성 그룹을 공유하는 다른 수집까지 큐에서 함께 막힌다(2026-08-18 실측).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install chromium --with-deps
        timeout-minutes: 10
      - name: 예고 선발 (오늘+내일)
        run: node scripts/extract-kbo-preview.mjs
      - name: KST 요일 계산
        id: kst
        run: echo "dow=$(TZ=Asia/Seoul date +%u)" >> "$GITHUB_OUTPUT" # 1=월
      - name: 등록/말소 (평시 15시, 월요일은 18시 회차)
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event.schedule == '0 6 * * *' && steps.kst.outputs.dow != '1') ||
          (github.event.schedule == '0 9 * * *' && steps.kst.outputs.dow == '1')
        run: node scripts/extract-kbo-availability.mjs
      - name: commit & push
        # 스크립트가 실패해도 그 전에 저장된 수집분은 커밋한다(md 쓰기는 멱등, 실패 알림은 잡 상태로 유지).
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || (git commit -m "data: sync-preview 예고 선발 갱신" && git pull --rebase && git push)
      - name: 복구 시 실패 이슈 닫기
        # 열린 이슈 = "지금 고장 중"을 유지한다. 안 닫으면 한 번 뜬 이슈가 계속 남아
        # 알림이 신호 역할을 못 한다(2026-08 이슈 #1 사례).
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITLE="[sync-preview 실패] 수집 파이프라인 점검 필요"
          NUM=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty' || true)
          if [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "복구 확인: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
      - name: 실패 알림 이슈
        # 실패를 Actions 탭 밖으로 알린다. 같은 제목의 열린 이슈가 있으면 코멘트만 추가(중복 방지).
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITLE="[sync-preview 실패] 수집 파이프라인 점검 필요"
          BODY="실패 런: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          NUM=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty' || true)
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
